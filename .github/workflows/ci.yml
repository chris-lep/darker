name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        strategy:
            matrix:
                node-version: ['22', '24']
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            - name: Lint, format check and tests
              run: npm run check
